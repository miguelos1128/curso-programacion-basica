<!DOCTYPE html>
<html lang="es">
<head>

<body>
    <section id="seleccionar-mascota">

        <h2 class="subtitulo">Elige tu macota: </h2>

        <div id="contenedor-tajetas" class="tarjetas">
            
        </div>

    </section>

    <section id="seleccionar-ataque">

        <H2 class="subtitulo">Elige tú ataque</H2>

        <div id="conetenedor-ataques" class="tarjetas-ataque">
            
        </div>

            <p id="resultado">Mucha suerte</p>     
            
            <section id ="reiniciar">
                <button id="boton-reiniciar">Reiniciar</button>
            </section>
        </div>

        <div class="ataques">
            <div>
                <p id="mascota-jugador">Capipepo</p>
                <p id="vidas-jugador">3</p> 
                <div id="ataque-del-jugador"></div>
            </div>
            <div>
                <p id="mascota-enemigo"> mascota enemigo </p>
                <p id="vidas-enemigo">3</p>
                <div id="ataque-del-enemigo"></div>
            </div>
        </div>
    </section>
    <Section class="regresar">
